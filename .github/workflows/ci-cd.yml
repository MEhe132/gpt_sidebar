name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & bytecode compilation check
        run: |
          python -m py_compile main.py sidebar_ui.py ai_service.py config_manager.py hotkey_manager.py settings_modal.py

      - name: Run unit test suite
        run: |
          python -m unittest discover tests -v

  build:
    name: Build Standalone Windows Executable (.exe)
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone Windows binary (.exe)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "AI_Sidebar" --collect-all customtkinter main.py

      - name: Package release ZIP
        shell: pwsh
        run: |
          $ReleaseDir = "release_pkg"
          New-Item -ItemType Directory -Path $ReleaseDir -Force | Out-Null
          Copy-Item "dist\AI_Sidebar.exe" -Destination $ReleaseDir
          Copy-Item "README.md" -Destination $ReleaseDir
          Copy-Item "LICENSE" -Destination $ReleaseDir
          Copy-Item "config.example.json" -Destination $ReleaseDir
          Copy-Item "run.bat" -Destination $ReleaseDir
          Copy-Item "run_silent.vbs" -Destination $ReleaseDir
          Compress-Archive -Path "$ReleaseDir\*" -DestinationPath "dist\AI_Sidebar_windows.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI_Sidebar-Windows
          path: |
            dist/AI_Sidebar.exe
            dist/AI_Sidebar_windows.zip
          retention-days: 30

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AI_Sidebar.exe
            dist/AI_Sidebar_windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
